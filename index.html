<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>水电站3D模拟 - 发电过程可视化</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; background: #0a0a1a; overflow: hidden; height: 100vh; width: 100vw; user-select: none; -webkit-user-select: none; }
    #app { position: relative; width: 100%; height: 100%; }
    #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    canvas { display: block; }
    #top-bar { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 8px; background: rgba(10, 10, 30, 0.88); backdrop-filter: blur(12px); border: 1px solid rgba(100, 140, 255, 0.25); border-radius: 14px; padding: 10px 18px; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5); }
    .metric-card { display: flex; flex-direction: column; align-items: center; min-width: 88px; padding: 2px 10px; border-right: 1px solid rgba(255, 255, 255, 0.08); }
    .metric-card:last-child { border-right: none; }
    .metric-label { font-size: 10px; color: rgba(160, 185, 230, 0.75); letter-spacing: 1px; margin-bottom: 2px; }
    .metric-value { font-size: 20px; font-weight: 700; color: #dce6ff; font-family: 'Consolas', 'Monaco', 'Courier New', monospace; }
    .metric-unit { font-size: 10px; color: rgba(160, 185, 230, 0.5); margin-left: 1px; }
    .metric-card.warning .metric-value { color: #fdcb6e; }
    .metric-card.danger .metric-value { color: #e94560; animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

    #control-panel { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); z-index: 10; background: rgba(10, 10, 30, 0.88); backdrop-filter: blur(12px); border: 1px solid rgba(100, 140, 255, 0.25); border-radius: 14px; padding: 14px; width: 230px; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; gap: 8px; max-height: 88vh; overflow-y: auto; }
    .panel-title { font-size: 12px; font-weight: 600; color: #788dc8; text-align: center; letter-spacing: 2px; padding-bottom: 5px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .control-group { display: flex; flex-direction: column; gap: 3px; }
    .control-group label { font-size: 11px; color: rgba(160, 185, 230, 0.7); display: flex; justify-content: space-between; align-items: center; }
    .control-group label .val { color: #64b5f6; font-weight: 600; font-size: 11px; }
    input[type="range"] { -webkit-appearance: none; width: 100%; height: 5px; border-radius: 3px; background: linear-gradient(90deg, #1a3a6e, #4a90d9); outline: none; cursor: pointer; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #64b5f6; border: 2px solid #1a3a6e; cursor: pointer; box-shadow: 0 0 10px rgba(100,180,255,0.5); }
    button { background: linear-gradient(135deg, #1a3a6e, #2a5a9e); color: #c8d8f8; border: 1px solid rgba(100, 140, 255, 0.35); border-radius: 8px; padding: 7px 10px; font-size: 10px; cursor: pointer; transition: all 0.25s; font-family: inherit; letter-spacing: 0.5px; width: 100%; }
    button:hover { background: linear-gradient(135deg, #2a4a8e, #3a6abe); border-color: rgba(100,160,255,0.6); box-shadow: 0 0 12px rgba(100,140,255,0.25); }
    button:active { transform: scale(0.97); }
    button.active { background: linear-gradient(135deg, #0f3460, #1a5276); border-color: #64b5f6; box-shadow: 0 0 10px rgba(100,180,255,0.35); }
    button.danger { background: linear-gradient(135deg, #6e1a1a, #9e2a2a); border-color: rgba(255,100,100,0.4); }
    button.drill-btn { background: linear-gradient(135deg, #3a2060, #5a3080); border-color: rgba(180,120,255,0.4); font-size: 10px; padding: 6px 8px; }
    button.drill-btn:hover { background: linear-gradient(135deg, #4a3070, #6a4090); box-shadow: 0 0 10px rgba(180,120,255,0.3); }
    button.drill-stop { background: linear-gradient(135deg, #503020, #704030); border-color: rgba(255,150,100,0.4); font-size: 10px; padding: 6px 8px; }

    .dispatch-row { display: flex; gap: 5px; }
    .dispatch-row button { flex: 1; font-size: 10px; padding: 6px 5px; }
    .dispatch-row button.mode-active { background: linear-gradient(135deg, #0a3050, #1a6080); border-color: #40c0e0; box-shadow: 0 0 8px rgba(64,192,224,0.3); }

    .fault-group { display: flex; flex-direction: column; gap: 4px; }
    .fault-row { display: flex; align-items: center; justify-content: space-between; font-size: 10px; color: rgba(160,185,230,0.7); }
    .fault-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 3px; }
    .fault-dot.ok { background: #00b894; box-shadow: 0 0 4px #00b894; }
    .fault-dot.fail { background: #e94560; box-shadow: 0 0 6px #e94560; animation: pulse 0.8s ease-in-out infinite; }
    .fault-btn { font-size: 9px; padding: 3px 6px; width: auto; border-radius: 5px; }

    #chart-panel { position: absolute; left: 14px; bottom: 16px; z-index: 10; display: flex; gap: 8px; background: rgba(10, 10, 30, 0.88); backdrop-filter: blur(12px); border: 1px solid rgba(100, 140, 255, 0.25); border-radius: 14px; padding: 12px; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5); }
    .chart-box { display: flex; flex-direction: column; align-items: center; }
    .chart-title { font-size: 10px; color: rgba(160,185,230,0.65); margin-bottom: 4px; letter-spacing: 1px; }
    .chart-box canvas { border-radius: 6px; background: rgba(0,0,0,0.25); }

    #prediction-panel { position: absolute; left: 14px; top: 100px; z-index: 10; background: rgba(10, 10, 30, 0.88); backdrop-filter: blur(12px); border: 1px solid rgba(100, 140, 255, 0.25); border-radius: 12px; padding: 10px 14px; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5); max-width: 260px; }
    #prediction-content { font-size: 10px; color: rgba(160,185,230,0.75); line-height: 1.6; }
    #prediction-content .pred-highlight { color: #40c0e0; font-weight: 600; }
    #prediction-content .pred-warn { color: #fdcb6e; }
    #prediction-content .pred-danger { color: #e94560; }

    #drill-panel { position: absolute; left: 14px; top: 260px; z-index: 10; background: rgba(10, 10, 30, 0.88); backdrop-filter: blur(12px); border: 1px solid rgba(180, 120, 255, 0.3); border-radius: 12px; padding: 10px 14px; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5); min-width: 240px; display: none; }
    #drill-panel.visible { display: block; }
    #drill-panel .drill-header { font-size: 11px; font-weight: 600; color: #b080e0; margin-bottom: 6px; text-align: center; }
    #drill-goals { display: flex; flex-direction: column; gap: 4px; }
    .drill-goal { font-size: 10px; color: rgba(180,160,230,0.6); padding: 3px 6px; border-radius: 4px; display: flex; align-items: center; gap: 6px; }
    .drill-goal.done { color: #00b894; background: rgba(0,184,148,0.08); }
    .drill-goal .goal-icon { font-size: 11px; }

    #fault-log-panel { position: absolute; left: 14px; top: 400px; z-index: 10; background: rgba(10, 10, 30, 0.88); backdrop-filter: blur(12px); border: 1px solid rgba(255, 150, 50, 0.3); border-radius: 12px; padding: 8px 12px; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5); min-width: 260px; max-height: 180px; overflow-y: auto; }
    #fault-log-header { font-size: 10px; font-weight: 600; color: #f0a040; text-align: center; margin-bottom: 4px; letter-spacing: 1px; }
    #fault-log-entries { display: flex; flex-direction: column; gap: 2px; }
    .fault-log-entry { font-size: 9px; color: rgba(200,200,220,0.7); padding: 2px 4px; border-left: 2px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; }
    .fault-log-entry.triggered { border-left-color: #e94560; color: #e9a0a0; }
    .fault-log-entry.resolved { border-left-color: #00b894; color: #80d0b0; }
    .fault-log-time { color: rgba(200,200,220,0.35); margin-left: 8px; white-space: nowrap; }

    #alert-overlay { position: absolute; top: 100px; left: 50%; transform: translateX(-50%); z-index: 20; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
    .alert-toast { background: rgba(233, 69, 96, 0.92); color: white; padding: 10px 22px; border-radius: 8px; font-size: 13px; font-weight: 600; text-align: center; animation: slideIn 0.4s ease-out, fadeOut 0.5s ease-in 3.5s forwards; backdrop-filter: blur(8px); border: 1px solid rgba(255,100,100,0.5); box-shadow: 0 4px 20px rgba(233,69,96,0.4); }
    .alert-toast.info { background: rgba(0, 150, 199, 0.92); border-color: rgba(100,200,255,0.5); box-shadow: 0 4px 20px rgba(0,150,199,0.4); }
    @keyframes slideIn { from{transform:translateY(-20px);opacity:0} to{transform:translateY(0);opacity:1} }
    @keyframes fadeOut { from{opacity:1} to{opacity:0} }

    #bottom-info { position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%); z-index: 10; font-size: 9px; color: rgba(160,185,230,0.35); letter-spacing: 1px; }
    .season-indicator { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 3px; vertical-align: middle; }
    .season-indicator.rainy { background: #4a90d9; box-shadow: 0 0 6px #4a90d9; }
    .season-indicator.dry { background: #e9a04a; box-shadow: 0 0 6px #e9a04a; }
    .weather-icon { font-size: 14px; vertical-align: middle; margin-right: 3px; }
    .dispatch-hint { font-size: 9px; color: rgba(160,185,230,0.35); text-align: center; margin-top: -3px; }
    .impact-text { font-size: 9px; color: #fdcb6e; text-align: center; margin-top: 2px; display: none; }
    .impact-text.show { display: block; }

    /* 调度预案面板样式 */
    #plan-panel { margin-top: 2px; }
    .plan-btn { font-size: 10px; padding: 6px 8px; margin: 2px 0; }
    .plan-btn.active { background: linear-gradient(135deg, #205030, #307050); border-color: #40d080; box-shadow: 0 0 8px rgba(64,208,128,0.3); }
    .plan-info { font-size: 9px; color: rgba(160,185,230,0.7); padding: 4px 6px; background: rgba(0,0,0,0.2); border-radius: 4px; margin-top: 4px; line-height: 1.5; }
    .plan-info .eta { color: #40d080; font-weight: 600; }

    /* 故障待办卡片样式 */
    #fault-todo-panel { margin-top: 2px; }
    .todo-section { margin-top: 4px; }
    .todo-section-title { font-size: 10px; color: rgba(160,185,230,0.6); padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 3px; }
    .todo-card { display: flex; justify-content: space-between; align-items: center; padding: 5px 6px; margin: 2px 0; border-radius: 5px; border-left: 3px solid; background: rgba(255,255,255,0.03); }
    .todo-card.active { border-left-color: #e94560; background: rgba(233,69,96,0.08); }
    .todo-card.completed { border-left-color: #00b894; background: rgba(0,184,148,0.05); opacity: 0.6; }
    .todo-label { font-size: 10px; color: rgba(200,210,240,0.9); }
    .todo-card.completed .todo-label { color: rgba(160,185,230,0.6); text-decoration: line-through; }
    .todo-time { font-size: 8px; color: rgba(160,185,230,0.4); margin-top: 1px; }
    .todo-btn { font-size: 9px; padding: 2px 6px; width: auto; border-radius: 4px; }
    .todo-card.completed .todo-btn { display: none; }

    /* 演练复盘报告弹窗 */
    #report-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); z-index: 100; display: none; justify-content: center; align-items: center; }
    #report-overlay.visible { display: flex; }
    #report-panel { background: rgba(10, 10, 30, 0.96); backdrop-filter: blur(16px); border: 1px solid rgba(100, 140, 255, 0.35); border-radius: 16px; padding: 18px; width: 90%; max-width: 520px; max-height: 80vh; overflow-y: auto; box-shadow: 0 8px 48px rgba(0,0,0,0.6); }
    #report-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    #report-title { font-size: 16px; font-weight: 700; color: #b080e0; }
    #report-close { width: auto; padding: 4px 10px; font-size: 12px; margin: 0; }
    .report-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .report-summary-item { background: rgba(0,0,0,0.2); padding: 8px; border-radius: 6px; }
    .report-summary-label { font-size: 10px; color: rgba(160,185,230,0.6); }
    .report-summary-value { font-size: 14px; font-weight: 600; color: #64b5f6; margin-top: 2px; }
    .report-faults { margin-bottom: 12px; }
    .report-fault-title { font-size: 12px; color: #f0a040; margin-bottom: 4px; }
    .report-fault-row { display: flex; justify-content: space-between; font-size: 10px; padding: 3px 0; color: rgba(200,210,240,0.8); border-bottom: 1px solid rgba(255,255,255,0.05); }
    #export-report-btn { margin-top: 8px; background: linear-gradient(135deg, #206030, #308050); border-color: rgba(64,208,128,0.5); }
  </style>
</head>
<body>
  <div id="app">
    <div id="canvas-container"></div>

    <div id="top-bar">
      <div class="metric-card" id="metric-water"><span class="metric-label">水位高度</span><span><span class="metric-value" id="val-water">0.00</span><span class="metric-unit">m</span></span></div>
      <div class="metric-card" id="metric-rpm"><span class="metric-label">水轮机转速</span><span><span class="metric-value" id="val-rpm">0</span><span class="metric-unit">RPM</span></span></div>
      <div class="metric-card" id="metric-power"><span class="metric-label">发电功率</span><span><span class="metric-value" id="val-power">0.00</span><span class="metric-unit">MW</span></span></div>
      <div class="metric-card" id="metric-flow"><span class="metric-label">瞬时流量</span><span><span class="metric-value" id="val-flow">0.00</span><span class="metric-unit">m³/s</span></span></div>
      <div class="metric-card" id="metric-temp"><span class="metric-label">发电机温度</span><span><span class="metric-value" id="val-temp">40</span><span class="metric-unit">°C</span></span></div>
    </div>

    <div id="control-panel">
      <div class="panel-title">⚡ 运行控制台</div>

      <div class="dispatch-row">
        <button id="mode-auto" class="mode-active">⚙️ 自动发电</button>
        <button id="mode-storage">💧 蓄水</button>
        <button id="mode-flood">🌊 防洪</button>
      </div>
      <div class="dispatch-hint" id="dispatch-hint"></div>
      <div class="impact-text" id="impact-text"></div>

      <div class="control-group">
        <label>闸门开度 <span class="val" id="gate-val">50%</span> <span id="manual-indicator" style="font-size:9px;color:#fdcb6e;display:none">⚡手动</span></label>
        <input type="range" id="gate-slider" min="0" max="100" value="50" step="1">
      </div>

      <button id="weather-btn"><span class="weather-icon">☀️</span> 天气：晴天</button>
      <button id="season-btn"><span class="season-indicator rainy"></span> 季节：雨季</button>
      <button id="view-btn">🏗️ 视角：外部全景</button>

      <div class="panel-title" style="font-size:10px;margin-top:2px;color:#b080e0;border-color:rgba(180,120,255,0.2)">🎯 应急演练</div>
      <button class="drill-btn" id="drill-flashflood">🌧️ 暴雨洪峰演练</button>
      <button class="drill-btn" id="drill-failure">🔧 机组故障演练</button>
      <button class="drill-btn" id="drill-spill">🌊 紧急泄洪演练</button>
      <button class="drill-stop" id="drill-stop" style="display:none">⏹️ 终止当前演练</button>

      <div class="panel-title" style="font-size:10px;margin-top:2px;color:#40d080;border-color:rgba(64,208,128,0.25)">📋 调度预案</div>
      <div id="plan-panel">
        <button class="plan-btn" id="plan-storm">🌧️ 暴雨防汛预案</button>
        <button class="plan-btn" id="plan-drought">💧 旱季保供预案</button>
        <button class="plan-btn" id="plan-emergency">🚨 紧急降水位预案</button>
        <div class="plan-info" id="plan-info" style="display:none"></div>
      </div>

      <div class="fault-group">
        <div class="panel-title" style="font-size:10px;margin-top:2px">⚠️ 故障状态</div>
        <div class="fault-row"><span><span class="fault-dot ok" id="dot-turbine"></span>水轮机卡滞</span><button class="fault-btn repair-btn" id="repair-turbine" disabled>维修</button></div>
        <div class="fault-row"><span><span class="fault-dot ok" id="dot-pipe"></span>输水管堵塞</span><button class="fault-btn repair-btn" id="repair-pipe" disabled>疏通</button></div>
        <div class="fault-row"><span><span class="fault-dot ok" id="dot-overheat"></span>发电机过热</span><button class="fault-btn cool-btn" id="cool-btn" disabled>冷却</button></div>
      </div>

      <div id="fault-todo-panel">
        <div class="todo-section" id="todo-active-section">
          <div class="todo-section-title">🔴 待处理故障</div>
          <div id="todo-active-list"></div>
        </div>
        <div class="todo-section" id="todo-completed-section">
          <div class="todo-section-title">✅ 已完成处理</div>
          <div id="todo-completed-list"></div>
        </div>
      </div>

      <button id="export-btn">📊 导出运行数据 CSV</button>
    </div>

    <div id="prediction-panel">
      <div id="prediction-content">⏳ 等待调度模式激活...</div>
    </div>

    <div id="drill-panel">
      <div class="drill-header" id="drill-header">🎯 演练进行中</div>
      <div id="drill-goals"></div>
      <div style="font-size:9px;color:rgba(180,160,230,0.4);margin-top:6px;text-align:center" id="drill-progress"></div>
    </div>

    <div id="fault-log-panel">
      <div id="fault-log-header">📋 事故记录时间线</div>
      <div id="fault-log-entries">
        <div style="font-size:9px;color:rgba(160,185,230,0.3);text-align:center">暂无事故记录</div>
      </div>
    </div>

    <div id="chart-panel">
      <div class="chart-box"><span class="chart-title">水位 (m)</span><canvas id="chart-water" width="260" height="100"></canvas></div>
      <div class="chart-box"><span class="chart-title">功率 (MW)</span><canvas id="chart-power" width="260" height="100"></canvas></div>
      <div class="chart-box"><span class="chart-title">流量 (m³/s)</span><canvas id="chart-flow" width="260" height="100"></canvas></div>
    </div>

    <div id="alert-overlay"></div>
    <div id="bottom-info">💡 鼠标拖拽旋转 | 滚轮缩放 | 右键平移 | 调度/演练模式一键切换 | 冷却完成后过热自动恢复</div>

    <div id="report-overlay">
      <div id="report-panel">
        <div id="report-header">
          <span id="report-title">📊 演练复盘报告</span>
          <button id="report-close">✕ 关闭</button>
        </div>
        <div class="report-summary" id="report-summary"></div>
        <div class="report-faults" id="report-faults">
          <div class="report-fault-title">🔧 事故处理记录</div>
          <div id="report-fault-list"></div>
        </div>
        <button id="export-report-btn">📥 导出复盘报告 CSV</button>
      </div>
    </div>
  </div>

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
